<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MV GAMER | Universo Gamer para Roblox, Minecraft, Fortnite y Fútbol</title>
<meta name="description" content="MV GAMER: guías seguras, memes, minijuegos, ranking, insignias y coach gamer con IA para jugadores de 8 a 18 años.">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#060713;
  --bg2:#0d0f24;
  --card:rgba(18,21,49,.82);
  --border:rgba(157,92,255,.25);
  --violet:#9d5cff;
  --pink:#ff3ec8;
  --cyan:#22e6ff;
  --lime:#b6ff3b;
  --gold:#ffd13b;
  --red:#ff4154;
  --text:#f0f2ff;
  --muted:#9aa1c9;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Rajdhani",system-ui,sans-serif;
  font-size:18px;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  line-height:1.5;
  padding-bottom:80px;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* Luces de fondo */
.bg-fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
.bg-fx::before{
  content:"";position:absolute;inset:-40%;
  background:
    radial-gradient(circle at 15% 20%,rgba(157,92,255,.22),transparent 40%),
    radial-gradient(circle at 85% 30%,rgba(34,230,255,.18),transparent 40%),
    radial-gradient(circle at 50% 85%,rgba(255,62,200,.16),transparent 45%);
}

.container{max-width:1200px;margin:0 auto;padding:0 20px}

/* Encabezado */
header{
  position:sticky;top:0;z-index:90;
  background:rgba(6,7,19,.88);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.nav-wrap{
  display:flex;align-items:center;justify-content:space-between;
  height:72px;
}
.brand{
  font-family:"Orbitron",sans-serif;font-size:24px;font-weight:900;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.brand-badge{
  font-size:11px;padding:3px 8px;border-radius:20px;
  background:rgba(182,255,59,.18);color:var(--lime);
  border:1px solid var(--lime);font-family:"Rajdhani",sans-serif;
  font-weight:700;letter-spacing:1px;-webkit-text-fill-color:initial;
}
.nav-links{display:flex;gap:18px;align-items:center}
@media(max-width:850px){.nav-links{display:none}}
.nav-links a{
  font-weight:700;text-transform:uppercase;font-size:15px;letter-spacing:1px;
  color:var(--muted);transition:.2s;padding:6px 10px;border-radius:8px;
}
.nav-links a:hover{color:var(--text);background:rgba(157,92,255,.12)}

/* Botones */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 24px;border-radius:10px;font-weight:700;text-transform:uppercase;
  font-size:15px;letter-spacing:1px;transition:.25s;
}
.btn-primary{
  background:linear-gradient(135deg,var(--pink),var(--violet));
  color:#fff;box-shadow:0 0 20px rgba(255,62,200,.35);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(255,62,200,.6)}
.btn-cyan{
  background:linear-gradient(135deg,var(--cyan),#1890ff);
  color:#040c1a;box-shadow:0 0 20px rgba(34,230,255,.35);font-weight:800;
}
.btn-cyan:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(34,230,255,.6)}
.btn-outline{
  border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);
}
.btn-outline:hover{border-color:var(--cyan);background:rgba(34,230,255,.1)}

/* Hero */
.hero{padding:60px 0 40px;text-align:center}
.hero-tag{
  display:inline-block;padding:6px 14px;border-radius:30px;
  background:rgba(157,92,255,.18);border:1px solid var(--violet);
  color:var(--cyan);font-weight:700;font-size:13px;letter-spacing:2px;
  margin-bottom:18px;text-transform:uppercase;
}
.hero h1{
  font-family:"Orbitron",sans-serif;font-size:clamp(30px,6vw,54px);
  font-weight:900;line-height:1.15;margin-bottom:18px;
}
.hero h1 span{
  background:linear-gradient(135deg,var(--cyan) 20%,var(--pink) 80%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero p{
  max-width:680px;margin:0 auto 30px;color:var(--muted);font-size:19px;
}
.hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* Accesos rápidos */
.quick-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;margin:40px 0;
}
.quick-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px;text-align:center;transition:.25s;display:block;
}
.quick-card:hover{
  border-color:var(--cyan);transform:translateY(-4px);
  box-shadow:0 8px 24px rgba(34,230,255,.18);
}
.quick-card .icon{font-size:28px;margin-bottom:6px}
.quick-card .label{font-family:"Orbitron",sans-serif;font-size:13px;font-weight:700}

/* Secciones */
section{padding:50px 0;border-top:1px solid rgba(255,255,255,.05)}
.sec-head{text-align:center;margin-bottom:36px}
.sec-head h2{
  font-family:"Orbitron",sans-serif;font-size:32px;font-weight:800;margin-bottom:8px;
}
.sec-head p{color:var(--muted);font-size:17px}

/* Coach Gamer IA */
.ai-box{
  background:linear-gradient(145deg,rgba(20,24,55,.9),rgba(11,13,32,.95));
  border:2px solid var(--cyan);border-radius:16px;padding:28px;
  box-shadow:0 0 40px rgba(34,230,255,.15);
}
.ai-badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;
  background:rgba(34,230,255,.15);border-radius:20px;color:var(--cyan);
  font-size:13px;font-weight:700;letter-spacing:1px;margin-bottom:14px;
}
.ai-suggests{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.ai-chip{
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  padding:6px 14px;border-radius:20px;font-size:14px;font-weight:600;
  transition:.2s;color:var(--muted);
}
.ai-chip:hover{border-color:var(--cyan);color:var(--text);background:rgba(34,230,255,.1)}
.ai-input-wrap{display:flex;gap:10px;margin-top:14px}
@media(max-width:600px){.ai-input-wrap{flex-direction:column}}
.ai-input{
  flex:1;background:rgba(6,7,19,.8);border:1px solid var(--border);
  padding:14px 18px;border-radius:10px;color:var(--text);font-family:inherit;font-size:16px;
}
.ai-input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 15px rgba(34,230,255,.3)}
.ai-response{
  margin-top:20px;padding:20px;border-radius:12px;background:rgba(157,92,255,.12);
  border-left:4px solid var(--cyan);display:none;animation:fadeIn .3s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Guías */
.games-filter{display:flex;gap:10px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.filter-btn{
  padding:8px 18px;border-radius:20px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);font-weight:700;font-size:14px;transition:.2s;
}
.filter-btn.active,.filter-btn:hover{background:var(--violet);border-color:var(--violet);color:#fff}

.guides-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.guide-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:22px;transition:.25s;display:flex;flex-direction:column;
}
.guide-card:hover{border-color:var(--pink);transform:translateY(-4px);box-shadow:0 10px 30px rgba(255,62,200,.2)}
.guide-tag{
  align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;
  border-radius:6px;text-transform:uppercase;margin-bottom:12px;
}
.tag-roblox{background:rgba(255,65,84,.2);color:var(--red);border:1px solid var(--red)}
.tag-minecraft{background:rgba(182,255,59,.2);color:var(--lime);border:1px solid var(--lime)}
.tag-fortnite{background:rgba(34,230,255,.2);color:var(--cyan);border:1px solid var(--cyan)}
.tag-futbol{background:rgba(255,209,59,.2);color:var(--gold);border:1px solid var(--gold)}
.guide-card h3{font-family:"Orbitron",sans-serif;font-size:18px;margin-bottom:8px}
.guide-card p{color:var(--muted);font-size:15px;flex:1;margin-bottom:14px}

/* Alojamientos */
.alojamientos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}
.alojamiento-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  text-align: center;
  transition: .25s;
}
.alojamiento-card:hover {
  border-color: var(--cyan);
  transform: translateY(-4px);
  box-shadow: 0 10px 30px rgba(34,230,255,.2);
}
.alojamiento-card h3 {
  font-family: "Orbitron", sans-serif;
  font-size: 19px;
  margin-bottom: 10px;
  color: var(--text);
}
.alojamiento-card p {
  color: var(--muted);
  font-size: 15px;
  margin-bottom: 18px;
}

/* NUEVOS ESTILOS: Minijuegos */
.arcade-container {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  margin-bottom: 24px;
}
.game-screen {
  background: #020308;
  border: 2px dashed var(--pink);
  border-radius: 12px;
  min-height: 200px;
  margin: 20px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* NUEVOS ESTILOS: Memes con subida y puntuaciones */
.meme-upload-box {
  background: rgba(255, 255, 255, 0.03);
  border: 2px dashed var(--violet);
  padding: 30px;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 30px;
  cursor: pointer;
  transition: 0.2s;
}
.meme-upload-box:hover {
  border-color: var(--pink);
  background: rgba(255, 62, 200, 0.05);
}
.memes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}
.meme-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.meme-img {
  width: 100%;
  height: 220px;
